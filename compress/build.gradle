plugins {
    id 'com.android.library'
    id 'maven-publish'
}


android {
    compileSdkVersion 27
    namespace 'com.luck.lib.compress'
    defaultConfig {
        minSdkVersion 14
        targetSdkVersion 27
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

ext {
    PUBLISH_ARTIFACT_ID = "compress"
}


dependencies {}

def libVersion = rootProject.ext.has("libVersion") ? rootProject.ext.libVersion : "3.11.7"

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'io.github.zwx-97'
                artifactId = 'compress' // 👈 子模块 artifactId
                version = libVersion
            }
        }
    }
}